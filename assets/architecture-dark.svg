<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="t d">
<title id="t">delegate architecture</title>
<desc id="d">Claude calls the delegate engine. The engine runs the Codex worker, the project gates and the two goldfish reviewers; findings go back to Claude for triage; high-risk changes need the human&#x27;s approval.</desc>
<defs><marker id="ah-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#bdbfb2"/></marker></defs>
<rect width="1100" height="470" rx="16" fill="#1a1c19" stroke="#41453d"/>
<text x="32" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="650" fill="#f1eee3" text-anchor="start">How a task flows</text>
<text x="32" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#bdbfb2" text-anchor="start">Claude decides; the delegate engine enforces. Nothing reaches done without evidence on the current code.</text>
<rect x="32" y="110" width="230" height="120" rx="12" fill="#222521" stroke="#41453d" stroke-width="1.2"/>
<text x="48" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#f1eee3" text-anchor="start">Claude · the elephant</text>
<text x="48" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">plans, writes briefs</text>
<text x="48" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">triages every 🔴/🟡</text>
<text x="48" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">makes the final calls</text>
<rect x="330" y="100" width="300" height="270" rx="12" fill="#493127" stroke="#ffac89" stroke-width="1.2"/>
<text x="346" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#ffac89" text-anchor="start">delegate engine</text>
<text x="346" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">task state on disk (resume anywhere)</text>
<text x="346" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">diff_hash of the scoped diff</text>
<text x="346" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">timeouts + process-tree kill</text>
<text x="346" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">secret scan before anything leaves</text>
<text x="346" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">risk tiers: low / medium / high</text>
<text x="346" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">done refuses without fresh evidence</text>
<text x="346" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">approve: human-only, real console</text>
<rect x="700" y="96" width="360" height="82" rx="12" fill="#222521" stroke="#41453d" stroke-width="1.2"/>
<text x="716" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#f1eee3" text-anchor="start">Codex · worker</text>
<text x="716" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">codex exec -s workspace-write  (sandboxed)</text>
<rect x="700" y="196" width="360" height="82" rx="12" fill="#222521" stroke="#41453d" stroke-width="1.2"/>
<text x="716" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#f1eee3" text-anchor="start">Project gates</text>
<text x="716" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">your lint / typecheck / tests, sequential</text>
<rect x="700" y="296" width="360" height="100" rx="12" fill="#222521" stroke="#41453d" stroke-width="1.2"/>
<text x="716" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#f1eee3" text-anchor="start">Goldfish reviewers</text>
<text x="716" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">Codex (read-only) + Gemini via agy (plan)</text>
<text x="716" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">in parallel, no chat history</text>
<path d="M262 170 H322" fill="none" stroke="#bdbfb2" stroke-width="1.6" marker-end="url(#ah-dark)"/><text x="272" y="160" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#bdbfb2" text-anchor="start">calls</text>
<path d="M630 137 H692" fill="none" stroke="#bdbfb2" stroke-width="1.6" marker-end="url(#ah-dark)"/><text x="640" y="127" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#bdbfb2" text-anchor="start">work</text>
<path d="M630 237 H692" fill="none" stroke="#bdbfb2" stroke-width="1.6" marker-end="url(#ah-dark)"/><text x="636" y="227" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#bdbfb2" text-anchor="start">verify</text>
<path d="M630 337 H692" fill="none" stroke="#bdbfb2" stroke-width="1.6" marker-end="url(#ah-dark)"/><text x="634" y="327" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#bdbfb2" text-anchor="start">review</text>
<path d="M880 396 V432 Q880 440 872 440 H24 Q16 440 16 432 V178 Q16 170 24 170 H30" fill="none" stroke="#bdbfb2" stroke-width="1.6" marker-end="url(#ah-dark)"/><text x="380" y="432" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#bdbfb2" text-anchor="start">🔴 🟡 🟢 findings → Claude triages (fix | contest)</text>
<rect x="32" y="262" width="230" height="96" rx="12" fill="#303e32" stroke="#b2d6af" stroke-width="1.2"/>
<text x="48" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#b2d6af" text-anchor="start">You</text>
<text x="48" y="312" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">delegate approve &lt;id&gt;</text>
<text x="48" y="331" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#bdbfb2" text-anchor="start">for high-risk changes</text>
<path d="M262 310 H322" fill="none" stroke="#bdbfb2" stroke-width="1.6" marker-end="url(#ah-dark)"/>
</svg>
