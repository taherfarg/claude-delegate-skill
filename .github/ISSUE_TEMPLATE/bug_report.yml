name: Bug report
description: delegate did something wrong (or let something through it shouldn't have)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what delegate did instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Command output, and for Codex/agy problems the last 20 lines of the log in `.delegate/tasks/<id>/`. Remove anything secret.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `delegate --version`, `codex --version`, `agy --version`, `python --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: checkboxes
    id: gate
    attributes:
      label: Gate safety
      options:
        - label: This lets `done` or `approve` pass without the evidence the rules require (if so, consider SECURITY.md instead)
