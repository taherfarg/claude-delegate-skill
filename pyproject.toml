[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "delegate-cli"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
delegate = "delegate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["delegate"]
